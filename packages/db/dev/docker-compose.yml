# LOCAL DEV ONLY. Production/staging Postgres is defined in infra/docker-compose.yml (I1).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: crm_owner_dev
      POSTGRES_DB: crm
    ports: ["5432:5432"]
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  crm_pgdata:
