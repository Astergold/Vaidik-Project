services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    networks:
      - crm-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - crm-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  crm-api:
    image: node:22-alpine
    restart: unless-stopped
    command: node -e "const http = require('http'); http.createServer((r,s) => { s.writeHead(200); s.end('ok'); }).listen(3001);"
    networks:
      - crm-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 3

  crm-web:
    image: node:22-alpine
    restart: unless-stopped
    command: node -e "const http = require('http'); http.createServer((r,s) => { s.writeHead(200); s.end('ok'); }).listen(3000);"
    networks:
      - crm-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  crm-worker:
    image: node:22-alpine
    restart: unless-stopped
    command: tail -f /dev/null
    networks:
      - crm-internal

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - crm-internal

  glitchtip:
    image: glitchtip/glitchtip
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: dev-secret-key-placeholder
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - crm-internal

volumes:
  crm-db-data:
  uptime-kuma-data:

networks:
  crm-internal:
    driver: bridge
